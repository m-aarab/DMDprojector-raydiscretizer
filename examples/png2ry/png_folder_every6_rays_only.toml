[projection]
width = 200.0
height = 200.0
axis = "y"
direction = 1
focus_plane_position = 0.0
source_plane_position = -200.0
center = [0.0, 0.0]

[emission]
origin_type = "pixelated"
base_intensity = 1.0

[focus]
mode = "collimated"
cone_half_angle_deg = 0.0

[mask]
type = "png"
png_folder = "./frames"
frame_step = 6
pixel_pitch = [10.0, 10.0]
offset = [0.0, 0.0]

[pixels]
rays_per_pixel = 1
pitch = [10.0, 10.0]
size = [10.0, 10.0]
activation_mode = "center"
aa_samples = 8
intensity_mode = "flat"
gaussian_size_type = "1/e2_diameter"

[output]
output_folder = "./output/folder_every6"
output_filename = "placeholder.ry"
batch_count = 1
overwrite = true
seed = 42
rays_only = true

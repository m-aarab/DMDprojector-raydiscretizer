[projection]
width = 1080.0
height = 1920.0
axis = "y"
direction = 1
focus_plane_position = 0.0
source_plane_position = -200.0
center = [0.0, 0.0]

[emission]
origin_type = "pixelated"
base_intensity = 1.0

[focus]
mode = "collimated"
cone_half_angle_deg = 0.0

[mask]
type = "png"
png_path = "./frames/frame_0001.png"
pixel_pitch = [1.0, 1.0]
pixel_dimension = [1.0, 1.0]
offset = [0.0, 0.0]

[pixels]
rays_per_pixel = 1
activation_mode = "center"
aa_samples = 8
intensity_mode = "flat"
gaussian_size_type = "1/e2_diameter"

[output]
output_folder = "./output"
output_filename = "png_mask_frame_0001_flat_1rpp.ry"
batch_count = 1
overwrite = true
seed = 42
